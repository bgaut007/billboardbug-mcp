name: Build committed MCP bundle
on:
  workflow_call:
    inputs:
      node:
        required: true
        type: string
    outputs:
      sha256:
        value: ${{ jobs.bundle.outputs.sha256 }}
      bytes:
        value: ${{ jobs.bundle.outputs.bytes }}
      files:
        value: ${{ jobs.bundle.outputs.files }}
      version:
        value: ${{ jobs.bundle.outputs.version }}
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha256: ${{ steps.metadata.outputs.sha256 }}
      bytes: ${{ steps.metadata.outputs.bytes }}
      files: ${{ steps.metadata.outputs.files }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ inputs.node }}
      - run: npm ci --ignore-scripts --engine-strict
      - run: npm audit --audit-level=moderate --ignore-scripts
      - run: npm run build
      - name: Reject generated build drift
        run: git diff --exit-code -- build/index.js build/media.js
      - name: Source helper and mocked upload regressions
        run: node --test test/media-security.mjs test/upload-handler-security.mjs
      - name: Verify local stdio runtime version without calling API tools
        run: |
          timeout 20s node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { Client } from '@modelcontextprotocol/sdk/client/index.js';
          import { StdioClientTransport } from '@modelcontextprotocol/sdk/client/stdio.js';
          const client = new Client({ name: 'offline-version-probe', version: '1' });
          try {
            await client.connect(new StdioClientTransport({ command: process.execPath, args: ['build/index.js'], env: { BILLBOARDBUG_API_BASE: 'https://offline.invalid' } }));
            assert.equal(client.getServerVersion()?.version, JSON.parse(readFileSync('package.json', 'utf8')).version);
          } finally { await client.close(); }
          NODE
      - run: npm prune --omit=dev --ignore-scripts
      - run: python3 scripts/bundle-preflight.py
      - name: Extracted-bundle regressions with mocked networking
        run: |
          mkdir "$RUNNER_TEMP/bbb-bundle-extracted/test"
          cp test/media-security.mjs test/upload-handler-security.mjs test/mock-upload-fetch.cjs "$RUNNER_TEMP/bbb-bundle-extracted/test/"
          cd "$RUNNER_TEMP/bbb-bundle-extracted"
          node --test test/media-security.mjs test/upload-handler-security.mjs
      - id: metadata
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/bbb-bundle-output/inventory.json`, 'utf8'));
          for (const [key, value] of Object.entries({ sha256: report.sha256, bytes: report.archiveBytes, files: report.fileCount, version: report.version })) appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcp-committed-bundle-node-${{ inputs.node }}
          path: ${{ runner.temp }}/bbb-bundle-output/
          retention-days: 7
          if-no-files-found: error
