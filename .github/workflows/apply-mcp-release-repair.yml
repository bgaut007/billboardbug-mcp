name: Apply validated MCP release repair
on:
  push:
    branches: [release/mcp-bundle-validation-2026-11-24]
    paths: [.github/workflows/apply-mcp-release-repair.yml]
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'bgaut007/billboardbug-mcp' && github.ref == 'refs/heads/release/mcp-bundle-validation-2026-11-24' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Generate tested dependency repair without lifecycle scripts or force
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact zod@4.6.7
          npm update @modelcontextprotocol/sdk --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts
          npm audit --audit-level=moderate --ignore-scripts
          npm ci --ignore-scripts
      - run: npm run build
      - run: node --test test/media-security.mjs test/upload-handler-security.mjs
      - name: Preserve full lockfile and prepare production bundle
        run: |
          cp package-lock.json "$RUNNER_TEMP/bbb-full-lock.json"
          npm prune --omit=dev --ignore-scripts
          python3 scripts/bundle-preflight.py
      - name: Test extracted bundle with mocked networking
        run: |
          mkdir "$RUNNER_TEMP/bbb-bundle-extracted/test"
          cp test/media-security.mjs test/upload-handler-security.mjs test/mock-upload-fetch.cjs "$RUNNER_TEMP/bbb-bundle-extracted/test/"
          cd "$RUNNER_TEMP/bbb-bundle-extracted"
          node --test test/media-security.mjs test/upload-handler-security.mjs
      - name: Restore full lockfile and record redacted validation receipt
        shell: bash
        run: |
          cp "$RUNNER_TEMP/bbb-full-lock.json" package-lock.json
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const inventory = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/bbb-bundle-output/inventory.json`, 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const names = ['@modelcontextprotocol/sdk', '@hono/node-server', 'body-parser', 'fast-uri', 'hono', 'zod'];
          const dependencies = Object.fromEntries(Object.entries(lock.packages).filter(([path]) => names.some(name => path === `node_modules/${name}` || path.endsWith(`/node_modules/${name}`))).map(([path, metadata]) => [path, metadata.version]));
          const hashes = Object.fromEntries(['package.json', 'package-lock.json', 'build/index.js', 'build/media.js'].map(path => [path, createHash('sha256').update(readFileSync(path)).digest('hex')]));
          const receipt = { candidateOnly: true, published: false, validationBaseCommit: process.env.GITHUB_SHA, node: process.version, version: inventory.version, archiveSha256: inventory.sha256, archiveBytes: inventory.archiveBytes, archiveFileCount: inventory.fileCount, committedFileHashes: hashes, dependencies, validated: ['moderate-or-higher audit gate', 'TypeScript build', 'source helper and mocked upload tests', '11 signature fixtures', 'archive structure and heuristic signature inspection', 'ZIP integrity and extraction', 'extracted helper and mocked upload tests'], limits: inventory.limits, note: 'Archive was generated in the validation workspace before this receipt commit. This is a candidate receipt, not release metadata, a new version, signature verification or desktop-host/production compatibility approval.' };
          writeFileSync('bundle-validation.json', JSON.stringify(receipt, null, 2) + '\n');
          NODE
      - name: Upload validated candidate for review only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcp-applied-repair-candidate-node-22
          path: ${{ runner.temp }}/bbb-bundle-output/
          retention-days: 7
          if-no-files-found: error
      - name: Commit only validated dependency files, generated build and receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          while IFS= read -r path; do
            case "$path" in
              package.json|package-lock.json|build/index.js|build/media.js|bundle-validation.json) ;;
              *) echo 'Unexpected tracked change; refusing to commit.'; exit 1 ;;
            esac
          done < <(git diff --name-only)
          git add -- package.json package-lock.json build/index.js build/media.js bundle-validation.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'security: apply validated MCP dependency and generated build repair'
          git -c credential.helper= -c 'credential.helper=!f() { printf "%s\n" "username=x-access-token" "password=$GH_TOKEN"; }; f' push origin HEAD:refs/heads/release/mcp-bundle-validation-2026-11-24
