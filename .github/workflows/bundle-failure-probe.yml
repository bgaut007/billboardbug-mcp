name: MCP bundle failure probe
on:
  push:
    branches: [release/mcp-bundle-validation-2026-11-24]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      outcome: ${{ steps.probe.outputs.outcome }}
      phase: ${{ steps.probe.outputs.phase }}
      code: ${{ steps.probe.outputs.code }}
      detail: ${{ steps.probe.outputs.detail }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - id: probe
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import { appendFileSync, mkdirSync, copyFileSync } from 'node:fs';
          import { join } from 'node:path';
          const extracted = join(process.env.RUNNER_TEMP, 'bbb-bundle-extracted');
          const commands = [
            ['resolve-zod', 'npm', ['install', '--package-lock-only', '--ignore-scripts', '--save-exact', 'zod@4.6.7', '--json']],
            ['refresh-sdk', 'npm', ['update', '@modelcontextprotocol/sdk', '--package-lock-only', '--ignore-scripts', '--json']],
            ['repair-audit', 'npm', ['audit', 'fix', '--package-lock-only', '--ignore-scripts', '--json']],
            ['install', 'npm', ['ci', '--ignore-scripts', '--json']],
            ['audit', 'npm', ['audit', '--json', '--audit-level=moderate', '--ignore-scripts']],
            ['build', 'npm', ['run', 'build']],
            ['source-tests', 'node', ['--test', 'test/media-security.mjs', 'test/upload-handler-security.mjs']],
            ['prune', 'npm', ['prune', '--omit=dev', '--ignore-scripts', '--json']],
            ['archive-inspection', 'python3', ['scripts/bundle-preflight.py']],
            ['extracted-tests', 'node', ['--test', 'test/media-security.mjs', 'test/upload-handler-security.mjs']]
          ];
          const clean = value => String(value).replace(/[^a-zA-Z0-9@/._: ,()=-]/g, '_').slice(0, 180);
          let report = { outcome: 'success', phase: 'all-phases', code: 'OK', detail: 'disposable-dependency-candidate' };
          for (const [phase, command, args] of commands) {
            if (phase === 'extracted-tests') {
              mkdirSync(join(extracted, 'test'));
              for (const file of ['media-security.mjs', 'upload-handler-security.mjs', 'mock-upload-fetch.cjs']) {
                copyFileSync(join('test', file), join(extracted, 'test', file));
              }
            }
            const result = spawnSync(command, args, { cwd: phase === 'extracted-tests' ? extracted : process.cwd(), encoding: 'utf8', shell: false, timeout: 180000, maxBuffer: 8 * 1024 * 1024 });
            if (result.status === 0 && !result.error) continue;
            let data;
            try { data = JSON.parse(result.stdout || '{}'); } catch { data = {}; }
            const rawCode = data.error?.code || result.error?.code || '';
            const code = /^[A-Z][A-Z0-9_]{0,39}$/.test(rawCode) ? rawCode : `EXIT_${result.status ?? 'SIGNAL'}`;
            let detail = 'raw-output-not-exported';
            const vulnerabilities = data.vulnerabilities || data.audit?.vulnerabilities;
            if ((phase === 'audit' || phase === 'repair-audit') && vulnerabilities) {
              detail = Object.entries(vulnerabilities).filter(([, v]) => ['moderate', 'high', 'critical'].includes(v.severity)).map(([name, v]) => `${name}:${v.severity}:fix=${typeof v.fixAvailable === 'object' && v.fixAvailable ? `${v.fixAvailable.name}@${v.fixAvailable.version}` : v.fixAvailable ? 'available' : 'none'}`).join(', ') || 'audit-repair-not-complete';
            } else if (phase === 'archive-inspection') {
              const errors = result.stderr || '';
              if (errors.includes('Credential signature requires review')) detail = 'credential-signature-match';
              else if (errors.includes('Sensitive-looking file rejected')) detail = 'sensitive-file-extension';
              else if (errors.includes('Symlink')) detail = 'symlink-rejected';
              else if (errors.includes('Missing required packaged file')) detail = 'required-package-file-missing';
              else if (errors.includes('AssertionError')) detail = 'structure-or-manifest-assertion';
              else if (errors.includes('SyntaxError')) detail = 'python-syntax-error';
            } else {
              const codes = [...new Set(`${result.stdout || ''}\n${result.stderr || ''}`.match(/\bTS[0-9]{4,5}\b/g) || [])];
              if (codes.length) detail = codes.slice(0, 8).join(', ');
            }
            report = { outcome: 'failure', phase, code, detail: clean(detail) };
            break;
          }
          for (const [key, value] of Object.entries(report)) appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${clean(value)}\n`);
          console.log(JSON.stringify(report, null, 2));
          NODE
      - name: Upload fully validated disposable candidate for review only
        if: steps.probe.outputs.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcp-dependency-candidate-node-22
          path: ${{ runner.temp }}/bbb-bundle-output/
          retention-days: 7
          if-no-files-found: error
  result:
    needs: probe
    name: 'Bundle probe / ${{ needs.probe.outputs.phase }} / ${{ needs.probe.outputs.code }} / ${{ needs.probe.outputs.detail }}'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          OUTCOME: ${{ needs.probe.outputs.outcome }}
        shell: bash
        run: |
          if [ "$OUTCOME" != 'success' ]; then exit 1; fi
